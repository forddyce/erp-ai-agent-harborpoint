# /etc/nginx/sites-available/erp.fordgamerprofile.com
server {
    listen 80;
    server_name erp.fordgamerprofile.com;

    auth_basic "Harbor Point ops";
    auth_basic_user_file /etc/nginx/.htpasswd_erp;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
