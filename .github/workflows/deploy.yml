name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync code to VPS
        uses: easingthemes/ssh-deploy@v5
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          TARGET: /opt/erp-agent
          EXCLUDE: ".git/, .github/, venv/, agent.db, data/, emails/, __pycache__/, .pytest_cache/, docs/"

      - name: Install deps and restart
        uses: appleboy/ssh-action@v1
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USERNAME: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        with:
          envs: HOST,USERNAME
          script: |
            set -e
            cd /opt/erp-agent
            [ -d venv ] || python3 -m venv venv
            venv/bin/pip install -q -r requirements.txt
            [ -f agent.db ] || venv/bin/python -m app.ingest
            sudo -n systemctl restart erp-agent
