name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync app to VPS
        run: |
          rsync -az --delete \
            --exclude .git --exclude .github --exclude venv --exclude agent.db \
            --exclude .env --exclude __pycache__ --exclude .pytest_cache \
            --exclude data --exclude emails --exclude docs --exclude "*.local.md" \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/erp-agent/

      - name: Install deps and restart service
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'cd /opt/erp-agent &&
             [ -d venv ] || python3 -m venv venv
             venv/bin/pip install -q -r requirements.txt &&
             [ -f agent.db ] || venv/bin/python -m app.ingest &&
             sudo -n systemctl restart erp-agent &&
             systemctl is-active erp-agent'
